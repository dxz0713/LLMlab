[project]
name = "lab06-gan"
version = "1.0.0"
description = "Lab 6: train a DCGAN on Fashion-MNIST with PyTorch"
requires-python = ">=3.11"
dependencies = [
    "numpy>=2.0,<3",
    "matplotlib>=3.8",
    "pytest>=8",
    "torch>=2.2,<3",
    "torchvision>=0.17,<1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "--tb=no -q"
