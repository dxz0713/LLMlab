[project]
name = "lab04-gnn"
version = "1.0.0"
description = "Lab 4: graph convolutional networks from scratch"
requires-python = ">=3.11"
dependencies = [
    "numpy>=2.0,<3",
    "matplotlib>=3.8",
    "pytest>=8",
    "scipy>=1.10",
    "networkx>=3.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "--tb=no -q"
